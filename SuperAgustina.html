<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Super Agustina Mobile</title>
<style>
  :root {
    --ui-bg: rgba(255,255,255,0.88);
    --ui-border: rgba(24,49,83,0.18);
    --text: #183153;
    --accent: #ff4f8b;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: linear-gradient(#dff6ff, #fff8ea);
    font-family: Arial, Helvetica, sans-serif;
    touch-action: none;
  }

  body {
    display: flex;
    justify-content: center;
    align-items: stretch;
  }

  #app {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
  }

  canvas {
    display: block;
    width: 100%;
    height: 100%;
    background: linear-gradient(#c7f0ff 0%, #eefcff 55%, #f7f0d8 55%, #ead9a7 100%);
  }

  .topbar {
    position: absolute;
    top: max(8px, env(safe-area-inset-top));
    left: 50%;
    transform: translateX(-50%);
    width: min(94vw, 900px);
    display: flex;
    justify-content: space-between;
    gap: 8px;
    z-index: 5;
    pointer-events: none;
  }

  .chip {
    background: var(--ui-bg);
    border: 1px solid var(--ui-border);
    color: var(--text);
    border-radius: 999px;
    padding: 8px 12px;
    font-size: 13px;
    font-weight: 700;
    box-shadow: 0 6px 20px rgba(0,0,0,0.10);
    white-space: nowrap;
  }

  .help {
    position: absolute;
    top: calc(max(8px, env(safe-area-inset-top)) + 44px);
    left: 50%;
    transform: translateX(-50%);
    width: min(92vw, 760px);
    text-align: center;
    color: var(--text);
    background: rgba(255,255,255,0.82);
    border: 1px solid var(--ui-border);
    border-radius: 18px;
    padding: 8px 12px;
    font-size: 13px;
    font-weight: 700;
    z-index: 4;
    pointer-events: none;
  }

  .controls {
    position: absolute;
    left: 0;
    right: 0;
    bottom: max(10px, env(safe-area-inset-bottom));
    padding: 0 12px 10px;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    z-index: 6;
    pointer-events: none;
  }

  .cluster {
    display: flex;
    gap: 10px;
    align-items: center;
    pointer-events: auto;
  }

  .dpad {
    display: grid;
    grid-template-columns: repeat(3, 58px);
    grid-template-rows: repeat(2, 58px);
    gap: 8px;
    align-items: center;
    justify-items: center;
  }

  .btn {
    width: 58px;
    height: 58px;
    border: none;
    border-radius: 18px;
    background: rgba(255,255,255,0.88);
    color: var(--text);
    font-size: 24px;
    font-weight: 900;
    box-shadow: 0 8px 18px rgba(0,0,0,0.14);
    border: 1px solid var(--ui-border);
    touch-action: none;
    user-select: none;
  }

  .btn:active,
  .btn.pressed {
    transform: scale(0.96);
    background: rgba(230,245,255,0.96);
  }

  .actionStack {
    display: grid;
    grid-template-columns: repeat(2, 74px);
    gap: 10px;
  }

  .action {
    width: 74px;
    height: 74px;
    border-radius: 999px;
    font-size: 13px;
    line-height: 1.1;
    padding: 10px;
  }

  .footerHint {
    position: absolute;
    bottom: calc(max(10px, env(safe-area-inset-bottom)) + 96px);
    left: 50%;
    transform: translateX(-50%);
    z-index: 4;
    background: rgba(255,255,255,0.75);
    color: var(--text);
    border-radius: 999px;
    padding: 7px 12px;
    font-size: 12px;
    font-weight: 700;
    pointer-events: none;
  }

  @media (max-width: 420px) {
    .dpad { grid-template-columns: repeat(3, 52px); grid-template-rows: repeat(2, 52px); gap: 7px; }
    .btn { width: 52px; height: 52px; border-radius: 16px; font-size: 22px; }
    .actionStack { grid-template-columns: repeat(2, 68px); }
    .action { width: 68px; height: 68px; font-size: 12px; }
    .chip { font-size: 12px; padding: 7px 10px; }
  }
</style>
</head>
<body>
<div id="app">
  <canvas id="game"></canvas>

  <div class="topbar">
    <div class="chip" id="scoreChip">Score: 0</div>
    <div class="chip" id="waveChip">Wave: 1</div>
    <div class="chip" id="hpChip">Energy: 8/8</div>
  </div>

  <div class="help" id="helpText">Tap to start • Move, jump, shoot bubbles, and use the dog bark blast</div>

  <div class="footerHint">Best in portrait mode</div>

  <div class="controls">
    <div class="cluster">
      <div class="dpad">
        <div></div>
        <button class="btn" data-action="jump">▲</button>
        <div></div>
        <button class="btn" data-action="left">◀</button>
        <button class="btn" data-action="none">●</button>
        <button class="btn" data-action="right">▶</button>
      </div>
    </div>

    <div class="cluster">
      <div class="actionStack">
        <button class="btn action" data-action="bubble">SOAP</button>
        <button class="btn action" data-action="bark">BARK</button>
      </div>
    </div>
  </div>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const scoreChip = document.getElementById("scoreChip");
const waveChip = document.getElementById("waveChip");
const hpChip = document.getElementById("hpChip");
const helpText = document.getElementById("helpText");

const DPR = Math.max(1, Math.min(2, window.devicePixelRatio || 1));
let W = 430;
let H = 820;
let groundY = 0;

function resizeCanvas() {
  canvas.width = Math.floor(window.innerWidth * DPR);
  canvas.height = Math.floor(window.innerHeight * DPR);
  canvas.style.width = window.innerWidth + "px";
  canvas.style.height = window.innerHeight + "px";
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  W = window.innerWidth;
  H = window.innerHeight;
  groundY = Math.floor(H * 0.76);
}
window.addEventListener("resize", resizeCanvas);
resizeCanvas();

const keys = {};
const touchControls = { left: false, right: false, jump: false, bubble: false, bark: false };

function setAction(action, active) {
  if (action in touchControls) touchControls[action] = active;
}

for (const btn of document.querySelectorAll("[data-action]")) {
  const action = btn.dataset.action;
  const start = (e) => {
    e.preventDefault();
    btn.classList.add("pressed");
    if (action !== "none") setAction(action, true);
    if (state === "title") startGame();
  };
  const end = (e) => {
    e.preventDefault();
    btn.classList.remove("pressed");
    if (action !== "none") setAction(action, false);
  };
  btn.addEventListener("pointerdown", start);
  btn.addEventListener("pointerup", end);
  btn.addEventListener("pointercancel", end);
  btn.addEventListener("pointerleave", end);
}

document.addEventListener("keydown", e => {
  const k = e.key.toLowerCase();
  keys[k] = true;
  if ([" ", "arrowup", "arrowdown", "arrowleft", "arrowright"].includes(k) || e.key === " ") e.preventDefault();
  if (state === "title" && (e.key === "Enter" || e.key === " ")) startGame();
  if (state === "gameover" && (k === "r" || e.key === " ")) resetGame();
});

document.addEventListener("keyup", e => {
  keys[e.key.toLowerCase()] = false;
});

canvas.addEventListener("pointerdown", () => {
  if (state === "title") startGame();
  else if (state === "gameover") resetGame();
});

function rand(min, max) { return Math.random() * (max - min) + min; }
function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }
function rectsOverlap(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}

let state = "title";
let cameraShake = 0;
let score = 0;
let wave = 1;
let winScore = 40;
let bubbles = [];
let barks = [];
let enemies = [];
let sparkles = [];
let splats = [];
let floatingTexts = [];
let spawnTimer = 0;
let difficultyTimer = 0;

const player = {
  x: 70, y: 0, w: 46, h: 88,
  vx: 0, vy: 0, speed: 4.2, jumpPower: 14.2,
  onGround: false, dir: 1, hp: 8, maxHp: 8,
  invuln: 0, attackCd: 0, barkCd: 0
};

const dog = { x: 20, y: 0, w: 72, h: 46, hop: 0, attackAnim: 0 };

function resetGame() {
  state = "title";
  cameraShake = 0;
  score = 0;
  wave = 1;
  bubbles = [];
  barks = [];
  enemies = [];
  sparkles = [];
  splats = [];
  floatingTexts = [];
  spawnTimer = 0;
  difficultyTimer = 0;
  player.x = 70;
  player.y = groundY - player.h;
  player.vx = 0;
  player.vy = 0;
  player.hp = player.maxHp;
  player.invuln = 0;
  player.attackCd = 0;
  player.barkCd = 0;
  dog.x = 15;
  dog.y = groundY - dog.h;
  dog.hop = 0;
  dog.attackAnim = 0;
  helpText.textContent = "Tap to start • Move, jump, shoot bubbles, and use the dog bark blast";
  updateHud();
}

function startGame() {
  state = "playing";
  helpText.textContent = "Defeat dirty dishes and save the kitchen";
}

function updateHud() {
  scoreChip.textContent = "Score: " + score;
  waveChip.textContent = "Wave: " + wave;
  hpChip.textContent = "Energy: " + player.hp + "/" + player.maxHp;
}

function spawnEnemy() {
  const typeRoll = Math.random();
  let type = "plate";
  if (typeRoll > 0.68 && typeRoll <= 0.88) type = "fork";
  else if (typeRoll > 0.88) type = "pan";

  const base = {
    type, x: W + rand(20, 120), y: groundY - 60,
    vx: rand(1.6, 2.9) + wave * 0.12, hp: 1,
    w: 54, h: 54, rot: rand(0, Math.PI * 2),
    spin: rand(-0.08, 0.08), bob: rand(0, Math.PI * 2),
    hitFlash: 0
  };

  if (type === "fork") {
    base.w = 24; base.h = 72; base.hp = 1; base.vx += 0.9; base.y = groundY - 72;
  } else if (type === "pan") {
    base.w = 78; base.h = 52; base.hp = 3; base.vx -= 0.35; base.y = groundY - 58;
  } else {
    base.hp = 2;
  }
  enemies.push(base);
}

function shootBubble() {
  if (player.attackCd > 0) return;
  player.attackCd = 16;
  bubbles.push({
    x: player.x + player.w / 2 + player.dir * 18,
    y: player.y + 30,
    vx: 8.4 * player.dir,
    vy: rand(-0.4, 0.4),
    r: 11
  });
  for (let i = 0; i < 8; i++) {
    sparkles.push({
      x: player.x + player.w / 2, y: player.y + 32,
      vx: rand(-2, 2), vy: rand(-2, 2), life: rand(18, 30), type: "bubble"
    });
  }
}

function barkBlast() {
  if (player.barkCd > 0) return;
  player.barkCd = 70;
  dog.attackAnim = 14;
  barks.push({
    x: dog.x + dog.w * 0.7, y: dog.y + 18, w: 110, h: 42,
    vx: 8 * player.dir, dir: player.dir, life: 18
  });
  floatingTexts.push({ x: dog.x + 40, y: dog.y - 8, text: "WOOF!", life: 28 });
}

function damagePlayer(amount) {
  if (player.invuln > 0) return;
  player.hp -= amount;
  player.invuln = 50;
  cameraShake = 10;
  floatingTexts.push({ x: player.x + 20, y: player.y - 10, text: "-" + amount, life: 28, hurt: true });
  if (player.hp <= 0) {
    player.hp = 0;
    state = "gameover";
    helpText.textContent = "Tap screen to restart";
  }
  updateHud();
}

function enemyBurst(e) {
  for (let i = 0; i < 12; i++) {
    splats.push({
      x: e.x + e.w / 2, y: e.y + e.h / 2,
      vx: rand(-3.5, 3.5), vy: rand(-4.2, -0.5),
      life: rand(20, 36), kind: e.type
    });
  }
}

function inputDown(name, altKey) {
  return touchControls[name] || keys[altKey];
}

function update() {
  if (state !== "playing") return;

  difficultyTimer++;
  if (difficultyTimer % 850 === 0) wave++;

  let moving = false;
  if (inputDown("left", "arrowleft") || keys["a"]) {
    player.vx = -player.speed;
    player.dir = -1;
    moving = true;
  } else if (inputDown("right", "arrowright") || keys["d"]) {
    player.vx = player.speed;
    player.dir = 1;
    moving = true;
  } else {
    player.vx *= 0.78;
  }

  if ((inputDown("jump", "arrowup") || keys["w"] || keys[" "]) && player.onGround) {
    player.vy = -player.jumpPower;
    player.onGround = false;
  }

  if (touchControls.bubble || keys["j"] || keys["f"]) shootBubble();
  if (touchControls.bark || keys["k"] || keys["g"]) barkBlast();

  player.x += player.vx;
  player.vy += 0.75;
  player.y += player.vy;

  if (player.y + player.h >= groundY) {
    player.y = groundY - player.h;
    player.vy = 0;
    player.onGround = true;
  }

  player.x = clamp(player.x, 16, W - 88);

  const dogTargetX = player.x - 66 * player.dir;
  dog.x += (dogTargetX - dog.x) * 0.08;
  dog.y = groundY - dog.h - Math.abs(Math.sin(dog.hop)) * 4;
  dog.hop += moving ? 0.25 : 0.08;

  if (player.attackCd > 0) player.attackCd--;
  if (player.barkCd > 0) player.barkCd--;
  if (player.invuln > 0) player.invuln--;

  spawnTimer--;
  const spawnRate = Math.max(32, 92 - wave * 5);
  if (spawnTimer <= 0) {
    spawnEnemy();
    spawnTimer = spawnRate + Math.floor(rand(-10, 14));
  }

  for (let i = bubbles.length - 1; i >= 0; i--) {
    const b = bubbles[i];
    b.x += b.vx; b.y += b.vy; b.r *= 0.998;
    if (b.x < -40 || b.x > W + 40 || b.y < -20 || b.y > H + 20) bubbles.splice(i, 1);
  }

  for (let i = barks.length - 1; i >= 0; i--) {
    const bk = barks[i];
    bk.x += bk.vx;
    bk.life--;
    if (bk.life <= 0) barks.splice(i, 1);
  }

  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    e.x -= e.vx;
    e.rot += e.spin;
    e.bob += 0.07;
    if (e.hitFlash > 0) e.hitFlash--;

    const eRect = {x: e.x, y: e.y, w: e.w, h: e.h};
    const pRect = {x: player.x + 8, y: player.y + 6, w: player.w - 16, h: player.h - 6};

    if (rectsOverlap(eRect, pRect)) {
      damagePlayer(e.type === "pan" ? 2 : 1);
      enemies.splice(i, 1);
      enemyBurst(e);
      continue;
    }

    let removed = false;

    for (let j = bubbles.length - 1; j >= 0; j--) {
      const b = bubbles[j];
      const bRect = {x: b.x - b.r, y: b.y - b.r, w: b.r * 2, h: b.r * 2};
      if (rectsOverlap(eRect, bRect)) {
        e.hp -= 1;
        e.hitFlash = 6;
        bubbles.splice(j, 1);
        for (let n = 0; n < 6; n++) {
          sparkles.push({
            x: b.x, y: b.y, vx: rand(-2.2, 2.2), vy: rand(-2.4, 2.4),
            life: rand(16, 26), type: "soap"
          });
        }
        if (e.hp <= 0) {
          score += (e.type === "pan" ? 5 : e.type === "fork" ? 2 : 3);
          floatingTexts.push({ x: e.x + e.w / 2, y: e.y, text: "+" + (e.type === "pan" ? 5 : e.type === "fork" ? 2 : 3), life: 24 });
          enemyBurst(e);
          enemies.splice(i, 1);
          removed = true;
          updateHud();
        }
        break;
      }
    }
    if (removed) continue;

    for (let j = barks.length - 1; j >= 0; j--) {
      const bk = barks[j];
      const r = {x: bk.x, y: bk.y, w: bk.w, h: bk.h};
      if (rectsOverlap(eRect, r)) {
        e.hp -= 2;
        e.hitFlash = 8;
        e.x += 16 * bk.dir;
        if (e.hp <= 0) {
          score += (e.type === "pan" ? 5 : e.type === "fork" ? 2 : 3);
          floatingTexts.push({ x: e.x + e.w / 2, y: e.y, text: "BONK!", life: 24 });
          enemyBurst(e);
          enemies.splice(i, 1);
          removed = true;
          updateHud();
        }
        bk.life = Math.min(bk.life, 4);
        break;
      }
    }
    if (removed) continue;

    if (e.x < -100) enemies.splice(i, 1);
  }

  for (let i = sparkles.length - 1; i >= 0; i--) {
    const s = sparkles[i];
    s.x += s.vx; s.y += s.vy; s.vy += 0.04; s.life--;
    if (s.life <= 0) sparkles.splice(i, 1);
  }

  for (let i = splats.length - 1; i >= 0; i--) {
    const s = splats[i];
    s.x += s.vx; s.y += s.vy; s.vy += 0.18; s.life--;
    if (s.life <= 0) splats.splice(i, 1);
  }

  for (let i = floatingTexts.length - 1; i >= 0; i--) {
    const t = floatingTexts[i];
    t.y -= 1.1; t.life--;
    if (t.life <= 0) floatingTexts.splice(i, 1);
  }

  if (cameraShake > 0) cameraShake *= 0.82;

  if (score >= winScore) {
    state = "gameover";
    helpText.textContent = "Kitchen saved! Tap to play again";
  }
}

function drawBackground() {
  ctx.save();
  ctx.globalAlpha = 0.9;
  ctx.fillStyle = "#ffe27a";
  ctx.beginPath();
  ctx.arc(W - 72, 78, 36, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  function cloud(x, y, s) {
    ctx.save();
    ctx.fillStyle = "rgba(255,255,255,0.9)";
    ctx.beginPath();
    ctx.arc(x, y, 18*s, 0, Math.PI * 2);
    ctx.arc(x+20*s, y-8*s, 22*s, 0, Math.PI * 2);
    ctx.arc(x+42*s, y, 17*s, 0, Math.PI * 2);
    ctx.arc(x+18*s, y+8*s, 20*s, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  cloud(38, 92, 0.9);
  cloud(W * 0.44, 76, 0.8);

  ctx.fillStyle = "#e6d4aa";
  ctx.fillRect(0, groundY, W, H - groundY);
  ctx.fillStyle = "#d3bc82";
  ctx.fillRect(0, groundY, W, 10);

  for (let x = 0; x < W; x += 46) {
    ctx.fillStyle = x % 92 === 0 ? "rgba(255,255,255,0.16)" : "rgba(0,0,0,0.04)";
    ctx.fillRect(x, groundY + 20, 24, H - groundY);
  }

  ctx.fillStyle = "#bb8d53";
  ctx.fillRect(18, H * 0.28, 120, 10);
  ctx.fillRect(W - 150, H * 0.31, 125, 10);

  for (let i = 0; i < 3; i++) {
    ctx.fillStyle = "#fff";
    ctx.beginPath();
    ctx.ellipse(42 + i*26, H * 0.275, 10, 4, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = "#c8d7e1";
    ctx.lineWidth = 1.5;
    ctx.stroke();
  }
}

function drawPlayer() {
  const blink = Math.floor(Date.now() / 250) % 8 === 0;
  const walk = Math.sin(Date.now() / 110) * 4 * Math.min(1, Math.abs(player.vx) / player.speed);
  const px = player.x, py = player.y;

  ctx.save();
  if (player.invuln > 0 && Math.floor(player.invuln / 4) % 2 === 0) ctx.globalAlpha = 0.5;

  ctx.strokeStyle = "#28415b";
  ctx.lineWidth = 7;
  ctx.lineCap = "round";
  ctx.beginPath();
  ctx.moveTo(px + 16, py + 72);
  ctx.lineTo(px + 14, py + 94 + walk);
  ctx.moveTo(px + 32, py + 72);
  ctx.lineTo(px + 36, py + 94 - walk);
  ctx.stroke();

  ctx.fillStyle = "#ff4f8b";
  ctx.beginPath();
  ctx.moveTo(px + 7, py + 34);
  ctx.lineTo(px + 39, py + 34);
  ctx.lineTo(px + 44, py + 76);
  ctx.lineTo(px + 3, py + 76);
  ctx.closePath();
  ctx.fill();

  ctx.strokeStyle = "#f1c39a";
  ctx.lineWidth = 6;
  ctx.beginPath();
  ctx.moveTo(px + 9, py + 43);
  ctx.lineTo(px - 3, py + 54 + walk * 0.5);
  ctx.moveTo(px + 37, py + 43);
  ctx.lineTo(px + 48, py + 54 - walk * 0.5);
  ctx.stroke();

  ctx.fillStyle = "#f1c39a";
  ctx.beginPath();
  ctx.arc(px + 23, py + 20, 18, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = "#6a3d20";
  ctx.beginPath();
  ctx.arc(px + 23, py + 15, 21, Math.PI, Math.PI * 2);
  ctx.lineTo(px + 43, py + 28);
  ctx.quadraticCurveTo(px + 40, py + 42, px + 33, py + 39);
  ctx.lineTo(px + 16, py + 39);
  ctx.quadraticCurveTo(px + 5, py + 42, px + 3, py + 27);
  ctx.closePath();
  ctx.fill();

  ctx.strokeStyle = "#1d1d1d";
  ctx.lineWidth = 2;
  if (!blink) {
    ctx.beginPath();
    ctx.moveTo(px + 16, py + 21); ctx.lineTo(px + 18, py + 21);
    ctx.moveTo(px + 27, py + 21); ctx.lineTo(px + 30, py + 21);
    ctx.stroke();
  }
  ctx.beginPath();
  ctx.arc(px + 23, py + 27, 5, 0.15, Math.PI - 0.15);
  ctx.stroke();

  ctx.fillStyle = "#5ed4ff";
  ctx.fillRect(px + (player.dir === 1 ? 38 : -4), py + 47, 14, 9);
  ctx.restore();
}

function drawDog() {
  const x = dog.x, y = dog.y;
  const wag = Math.sin(Date.now() / 90) * 10;
  const barkOpen = dog.attackAnim > 0 ? 6 : 0;
  if (dog.attackAnim > 0) dog.attackAnim--;

  ctx.save();
  ctx.fillStyle = "#111";
  ctx.fillRect(x + 14, y + 10, 40, 22);
  ctx.beginPath();
  ctx.ellipse(x + 27, y + 20, 26, 15, 0, 0, Math.PI * 2);
  ctx.fill();

  ctx.beginPath();
  ctx.arc(x + 62, y + 18, 13, 0, Math.PI * 2);
  ctx.fill();

  ctx.beginPath();
  ctx.moveTo(x + 55, y + 9);
  ctx.lineTo(x + 60, y - 6);
  ctx.lineTo(x + 67, y + 9);
  ctx.closePath();
  ctx.fill();

  ctx.fillRect(x + 18, y + 28, 5, 18);
  ctx.fillRect(x + 29, y + 28, 5, 18);
  ctx.fillRect(x + 42, y + 28, 5, 18);
  ctx.fillRect(x + 52, y + 28, 5, 18);

  ctx.strokeStyle = "#111";
  ctx.lineWidth = 5;
  ctx.beginPath();
  ctx.moveTo(x + 9, y + 16);
  ctx.lineTo(x - 6, y + 4 + wag * 0.15);
  ctx.stroke();

  ctx.fillStyle = "#fff";
  ctx.beginPath();
  ctx.arc(x + 66, y + 15, 2.1, 0, Math.PI * 2);
  ctx.fill();

  ctx.strokeStyle = "#fff";
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(x + 70, y + 23);
  ctx.lineTo(x + 77 + barkOpen, y + 25);
  ctx.stroke();

  ctx.restore();
}

function drawBubble(b) {
  ctx.save();
  const g = ctx.createRadialGradient(b.x - 4, b.y - 4, 2, b.x, b.y, b.r);
  g.addColorStop(0, "rgba(255,255,255,0.95)");
  g.addColorStop(0.45, "rgba(175,235,255,0.55)");
  g.addColorStop(1, "rgba(100,210,255,0.15)");
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = "rgba(255,255,255,0.85)";
  ctx.lineWidth = 2;
  ctx.stroke();
  ctx.restore();
}

function drawBark(b) {
  ctx.save();
  ctx.globalAlpha = b.life / 18;
  ctx.strokeStyle = "#6fd0ff";
  ctx.lineWidth = 4;
  for (let i = 0; i < 3; i++) {
    ctx.beginPath();
    ctx.arc(b.x + i * 20, b.y + b.h / 2, 16 + i * 9, -0.6, 0.6);
    ctx.stroke();
  }
  ctx.restore();
}

function drawEnemy(e) {
  ctx.save();
  ctx.translate(e.x + e.w/2, e.y + e.h/2 + Math.sin(e.bob) * 3);
  ctx.rotate(e.rot);

  if (e.hitFlash > 0) {
    ctx.shadowBlur = 18;
    ctx.shadowColor = "#9fe9ff";
  }

  if (e.type === "plate") {
    ctx.fillStyle = "#fdfdfd";
    ctx.beginPath();
    ctx.arc(0, 0, 24, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = "#cfd6dc";
    ctx.lineWidth = 5;
    ctx.stroke();
    ctx.fillStyle = "#6f4b2d";
    ctx.beginPath();
    ctx.arc(-5, -3, 5, 0, Math.PI * 2);
    ctx.arc(6, 4, 4, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = "#1d1d1d";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(-8, 6);
    ctx.lineTo(-2, 10);
    ctx.lineTo(10, 5);
    ctx.stroke();
  } else if (e.type === "fork") {
    ctx.fillStyle = "#b7c4ce";
    ctx.fillRect(-4, -30, 8, 55);
    ctx.fillRect(-9, -35, 3, 15);
    ctx.fillRect(-3, -35, 3, 15);
    ctx.fillRect(3, -35, 3, 15);
    ctx.fillRect(9, -35, 3, 15);
    ctx.fillStyle = "#6f4b2d";
    ctx.beginPath();
    ctx.arc(0, 12, 5, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = "#1d1d1d";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(-4, 21);
    ctx.lineTo(4, 21);
    ctx.stroke();
  } else if (e.type === "pan") {
    ctx.fillStyle = "#444";
    ctx.beginPath();
    ctx.ellipse(0, 0, 28, 18, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = "#888";
    ctx.lineWidth = 4;
    ctx.stroke();
    ctx.fillRect(14, -5, 28, 10);
    ctx.fillStyle = "#6f4b2d";
    ctx.beginPath();
    ctx.arc(-4, -1, 7, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = "#1d1d1d";
    ctx.beginPath();
    ctx.moveTo(-10, 9);
    ctx.lineTo(4, 8);
    ctx.stroke();
  }
  ctx.restore();
}

function drawParticles() {
  for (const s of sparkles) {
    ctx.save();
    ctx.globalAlpha = Math.max(0, s.life / 30);
    ctx.fillStyle = s.type === "soap" ? "#8fe3ff" : "#ffffff";
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.type === "soap" ? 3.5 : 2.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  for (const s of splats) {
    ctx.save();
    ctx.globalAlpha = Math.max(0, s.life / 36);
    ctx.translate(s.x, s.y);
    ctx.rotate(Math.atan2(s.vy, s.vx));
    ctx.fillStyle = s.kind === "plate" ? "#e4eef3" : s.kind === "fork" ? "#b7c4ce" : "#555";
    ctx.fillRect(-4, -2, 8, 4);
    ctx.fillStyle = "#6f4b2d";
    ctx.beginPath();
    ctx.arc(0, 0, 2.2, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  for (const t of floatingTexts) {
    ctx.save();
    ctx.globalAlpha = Math.max(0, t.life / 28);
    ctx.font = "bold 18px Arial";
    ctx.textAlign = "center";
    ctx.fillStyle = t.hurt ? "#d62828" : "#134074";
    ctx.fillText(t.text, t.x, t.y);
    ctx.restore();
  }
}

function drawMiniBars() {
  const x = 12, y = 88;
  ctx.save();

  ctx.fillStyle = "rgba(255,255,255,0.78)";
  ctx.fillRect(x, y, 126, 20);
  ctx.fillStyle = "#ef476f";
  ctx.fillRect(x + 3, y + 3, (player.hp / player.maxHp) * 120, 14);
  ctx.strokeStyle = "#355070";
  ctx.lineWidth = 2;
  ctx.strokeRect(x + 3, y + 3, 120, 14);

  ctx.fillStyle = "rgba(255,255,255,0.78)";
  ctx.fillRect(x, y + 26, 126, 14);
  ctx.fillStyle = "#6fd0ff";
  const barkReady = 1 - (player.barkCd / 70);
  ctx.fillRect(x + 3, y + 29, clamp(barkReady, 0, 1) * 120, 8);
  ctx.strokeStyle = "#355070";
  ctx.strokeRect(x + 3, y + 29, 120, 8);

  ctx.restore();
}

function drawTitle() {
  ctx.save();
  ctx.fillStyle = "rgba(255,255,255,0.78)";
  ctx.fillRect(22, H * 0.14, W - 44, H * 0.32);
  ctx.textAlign = "center";
  ctx.fillStyle = "#183153";
  ctx.font = "bold 34px Arial";
  ctx.fillText("SUPER AGUSTINA", W / 2, H * 0.21);
  ctx.font = "bold 18px Arial";
  ctx.fillStyle = "#355070";
  ctx.fillText("Brown-haired hero + big black dog", W / 2, H * 0.27);
  ctx.fillText("vs dirty dishes!", W / 2, H * 0.31);
  ctx.font = "16px Arial";
  ctx.fillStyle = "#1d3557";
  ctx.fillText("Use the touch buttons below", W / 2, H * 0.37);
  ctx.fillText("Tap anywhere to start", W / 2, H * 0.41);
  ctx.restore();
}

function drawGameOver() {
  ctx.save();
  ctx.fillStyle = "rgba(10,20,30,0.45)";
  ctx.fillRect(0, 0, W, H);

  ctx.fillStyle = "rgba(255,255,255,0.93)";
  ctx.fillRect(28, H * 0.24, W - 56, H * 0.22);

  ctx.textAlign = "center";
  ctx.fillStyle = "#183153";
  ctx.font = "bold 34px Arial";
  const won = score >= winScore && player.hp > 0;
  ctx.fillText(won ? "Kitchen Saved!" : "Dirty Dishes Win!", W / 2, H * 0.31);

  ctx.font = "bold 20px Arial";
  ctx.fillStyle = "#355070";
  ctx.fillText("Final Score: " + score, W / 2, H * 0.36);
  ctx.font = "16px Arial";
  ctx.fillText("Tap to play again", W / 2, H * 0.41);
  ctx.restore();
}

function render() {
  ctx.clearRect(0, 0, W, H);

  const shakeX = cameraShake > 0 ? rand(-cameraShake, cameraShake) : 0;
  const shakeY = cameraShake > 0 ? rand(-cameraShake, cameraShake) : 0;

  ctx.save();
  ctx.translate(shakeX, shakeY);

  drawBackground();
  for (const b of barks) drawBark(b);
  for (const b of bubbles) drawBubble(b);
  drawDog();
  drawPlayer();
  for (const e of enemies) drawEnemy(e);
  drawParticles();
  drawMiniBars();

  if (state === "title") drawTitle();
  if (state === "gameover") drawGameOver();

  ctx.restore();
}

function loop() {
  update();
  render();
  requestAnimationFrame(loop);
}

resetGame();
loop();
</script>
</body>
</html>
