<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Super Agustina</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: linear-gradient(#dff6ff, #fff8ea);
    font-family: Arial, Helvetica, sans-serif;
    overflow: hidden;
  }
  canvas {
    display: block;
    margin: 0 auto;
    background: linear-gradient(#c7f0ff 0%, #eefcff 55%, #f7f0d8 55%, #ead9a7 100%);
    box-shadow: 0 12px 30px rgba(0,0,0,0.22);
  }
  .overlay {
    position: fixed;
    top: 12px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(255,255,255,0.9);
    padding: 8px 14px;
    border-radius: 999px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.12);
    font-size: 14px;
    color: #2a2a2a;
    pointer-events: none;
  }
</style>
</head>
<body>
<div class="overlay">Move: ← → or A/D • Jump: Space/W/↑ • Soap Bubble: J/F • Dog Bark: K/G</div>
<canvas id="game" width="1100" height="650"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const W = canvas.width;
const H = canvas.height;
const groundY = 520;

const keys = {};
document.addEventListener("keydown", e => {
  keys[e.key.toLowerCase()] = true;
  if ([" ", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(e.key)) e.preventDefault();
  if (state === "title" && (e.key === "Enter" || e.key === " ")) startGame();
  if (state === "gameover" && (e.key.toLowerCase() === "r")) resetGame();
});
document.addEventListener("keyup", e => {
  keys[e.key.toLowerCase()] = false;
});

function rand(min, max) {
  return Math.random() * (max - min) + min;
}

function clamp(v, min, max) {
  return Math.max(min, Math.min(max, v));
}

function rectsOverlap(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}

let state = "title";
let cameraShake = 0;
let score = 0;
let wave = 1;
let winScore = 40;
let bubbles = [];
let barks = [];
let enemies = [];
let sparkles = [];
let splats = [];
let floatingTexts = [];
let spawnTimer = 0;
let difficultyTimer = 0;

const player = {
  x: 140,
  y: groundY - 110,
  w: 52,
  h: 96,
  vx: 0,
  vy: 0,
  speed: 4.5,
  jumpPower: 14.5,
  onGround: false,
  dir: 1,
  hp: 8,
  maxHp: 8,
  invuln: 0,
  attackCd: 0,
  barkCd: 0
};

const dog = {
  x: 80,
  y: groundY - 60,
  w: 76,
  h: 48,
  hop: 0,
  attackAnim: 0
};

function resetGame() {
  state = "title";
  cameraShake = 0;
  score = 0;
  wave = 1;
  bubbles = [];
  barks = [];
  enemies = [];
  sparkles = [];
  splats = [];
  floatingTexts = [];
  spawnTimer = 0;
  difficultyTimer = 0;
  player.x = 140;
  player.y = groundY - 110;
  player.vx = 0;
  player.vy = 0;
  player.hp = player.maxHp;
  player.invuln = 0;
  player.attackCd = 0;
  player.barkCd = 0;
  dog.x = 80;
  dog.y = groundY - 60;
  dog.hop = 0;
  dog.attackAnim = 0;
}

function startGame() {
  state = "playing";
}

function spawnEnemy() {
  const typeRoll = Math.random();
  let type = "plate";
  if (typeRoll > 0.68 && typeRoll <= 0.88) type = "fork";
  else if (typeRoll > 0.88) type = "pan";

  const base = {
    type,
    x: W + rand(20, 250),
    y: groundY - 60,
    vx: rand(1.6, 3.0) + wave * 0.12,
    hp: 1,
    w: 54,
    h: 54,
    rot: rand(0, Math.PI * 2),
    spin: rand(-0.08, 0.08),
    bob: rand(0, Math.PI * 2),
    hitFlash: 0
  };

  if (type === "fork") {
    base.w = 24;
    base.h = 72;
    base.hp = 1;
    base.vx += 0.9;
    base.y = groundY - 72;
  } else if (type === "pan") {
    base.w = 78;
    base.h = 52;
    base.hp = 3;
    base.vx -= 0.4;
    base.y = groundY - 58;
  } else {
    base.hp = 2;
  }
  enemies.push(base);
}

function shootBubble() {
  if (player.attackCd > 0) return;
  player.attackCd = 16;
  const speed = 9;
  bubbles.push({
    x: player.x + player.w / 2 + player.dir * 18,
    y: player.y + 30,
    vx: speed * player.dir,
    vy: rand(-0.4, 0.4),
    r: 12
  });
  for (let i = 0; i < 8; i++) {
    sparkles.push({
      x: player.x + player.w / 2,
      y: player.y + 32,
      vx: rand(-2, 2),
      vy: rand(-2, 2),
      life: rand(18, 30),
      type: "bubble"
    });
  }
}

function barkBlast() {
  if (player.barkCd > 0) return;
  player.barkCd = 70;
  dog.attackAnim = 14;
  const width = 120;
  barks.push({
    x: dog.x + dog.w * 0.7,
    y: dog.y + 18,
    w: width,
    h: 42,
    vx: 8 * player.dir,
    dir: player.dir,
    life: 18
  });
  floatingTexts.push({
    x: dog.x + 40,
    y: dog.y - 8,
    text: "WOOF!",
    life: 28
  });
}

function damagePlayer(amount) {
  if (player.invuln > 0) return;
  player.hp -= amount;
  player.invuln = 50;
  cameraShake = 10;
  floatingTexts.push({
    x: player.x + 20,
    y: player.y - 10,
    text: "-" + amount,
    life: 28,
    hurt: true
  });
  if (player.hp <= 0) {
    player.hp = 0;
    state = "gameover";
  }
}

function enemyBurst(e) {
  for (let i = 0; i < 12; i++) {
    splats.push({
      x: e.x + e.w / 2,
      y: e.y + e.h / 2,
      vx: rand(-3.5, 3.5),
      vy: rand(-4.2, -0.5),
      life: rand(20, 36),
      kind: e.type
    });
  }
}

function update() {
  if (state !== "playing") return;

  difficultyTimer++;
  if (difficultyTimer % 850 === 0) wave++;

  // movement
  let moving = false;
  if (keys["arrowleft"] || keys["a"]) {
    player.vx = -player.speed;
    player.dir = -1;
    moving = true;
  } else if (keys["arrowright"] || keys["d"]) {
    player.vx = player.speed;
    player.dir = 1;
    moving = true;
  } else {
    player.vx *= 0.78;
  }

  if ((keys[" "] || keys["arrowup"] || keys["w"]) && player.onGround) {
    player.vy = -player.jumpPower;
    player.onGround = false;
  }

  if (keys["j"] || keys["f"]) {
    shootBubble();
  }
  if (keys["k"] || keys["g"]) {
    barkBlast();
  }

  player.x += player.vx;
  player.vy += 0.75;
  player.y += player.vy;

  if (player.y + player.h >= groundY) {
    player.y = groundY - player.h;
    player.vy = 0;
    player.onGround = true;
  }
  player.x = clamp(player.x, 20, W - 120);

  // dog follows
  const dogTargetX = player.x - 72 * player.dir;
  dog.x += (dogTargetX - dog.x) * 0.08;
  dog.y = groundY - dog.h - Math.abs(Math.sin(dog.hop)) * 4;
  dog.hop += moving ? 0.25 : 0.08;

  if (player.attackCd > 0) player.attackCd--;
  if (player.barkCd > 0) player.barkCd--;
  if (player.invuln > 0) player.invuln--;

  spawnTimer--;
  const spawnRate = Math.max(28, 95 - wave * 5);
  if (spawnTimer <= 0) {
    spawnEnemy();
    spawnTimer = spawnRate + Math.floor(rand(-12, 15));
  }

  // projectiles
  for (let i = bubbles.length - 1; i >= 0; i--) {
    const b = bubbles[i];
    b.x += b.vx;
    b.y += b.vy;
    b.r *= 0.998;
    if (b.x < -40 || b.x > W + 40 || b.y < -20 || b.y > H + 20) bubbles.splice(i, 1);
  }

  for (let i = barks.length - 1; i >= 0; i--) {
    const bk = barks[i];
    bk.x += bk.vx;
    bk.life--;
    if (bk.life <= 0) barks.splice(i, 1);
  }

  // enemies
  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    e.x -= e.vx;
    e.rot += e.spin;
    e.bob += 0.07;
    if (e.hitFlash > 0) e.hitFlash--;

    const eRect = {x: e.x, y: e.y, w: e.w, h: e.h};
    const pRect = {x: player.x + 8, y: player.y + 6, w: player.w - 16, h: player.h - 6};

    if (rectsOverlap(eRect, pRect)) {
      damagePlayer(e.type === "pan" ? 2 : 1);
      enemies.splice(i, 1);
      enemyBurst(e);
      continue;
    }

    let removed = false;

    for (let j = bubbles.length - 1; j >= 0; j--) {
      const b = bubbles[j];
      const bRect = {x: b.x - b.r, y: b.y - b.r, w: b.r * 2, h: b.r * 2};
      if (rectsOverlap(eRect, bRect)) {
        e.hp -= 1;
        e.hitFlash = 6;
        bubbles.splice(j, 1);
        for (let n = 0; n < 6; n++) {
          sparkles.push({
            x: b.x,
            y: b.y,
            vx: rand(-2.2, 2.2),
            vy: rand(-2.4, 2.4),
            life: rand(16, 26),
            type: "soap"
          });
        }
        if (e.hp <= 0) {
          score += (e.type === "pan" ? 5 : e.type === "fork" ? 2 : 3);
          floatingTexts.push({
            x: e.x + e.w / 2,
            y: e.y,
            text: "+" + (e.type === "pan" ? 5 : e.type === "fork" ? 2 : 3),
            life: 24
          });
          enemyBurst(e);
          enemies.splice(i, 1);
          removed = true;
        }
        break;
      }
    }
    if (removed) continue;

    for (let j = barks.length - 1; j >= 0; j--) {
      const bk = barks[j];
      const r = {x: bk.x, y: bk.y, w: bk.w, h: bk.h};
      if (rectsOverlap(eRect, r)) {
        e.hp -= 2;
        e.hitFlash = 8;
        e.x += 16 * bk.dir;
        if (e.hp <= 0) {
          score += (e.type === "pan" ? 5 : e.type === "fork" ? 2 : 3);
          floatingTexts.push({
            x: e.x + e.w / 2,
            y: e.y,
            text: "BONK!",
            life: 24
          });
          enemyBurst(e);
          enemies.splice(i, 1);
          removed = true;
        }
        bk.life = Math.min(bk.life, 4);
        break;
      }
    }
    if (removed) continue;

    if (e.x < -100) enemies.splice(i, 1);
  }

  for (let i = sparkles.length - 1; i >= 0; i--) {
    const s = sparkles[i];
    s.x += s.vx;
    s.y += s.vy;
    s.vy += 0.04;
    s.life--;
    if (s.life <= 0) sparkles.splice(i, 1);
  }

  for (let i = splats.length - 1; i >= 0; i--) {
    const s = splats[i];
    s.x += s.vx;
    s.y += s.vy;
    s.vy += 0.18;
    s.life--;
    if (s.life <= 0) splats.splice(i, 1);
  }

  for (let i = floatingTexts.length - 1; i >= 0; i--) {
    const t = floatingTexts[i];
    t.y -= 1.1;
    t.life--;
    if (t.life <= 0) floatingTexts.splice(i, 1);
  }

  if (cameraShake > 0) cameraShake *= 0.82;

  if (score >= winScore) {
    state = "gameover";
  }
}

function drawBackground() {
  // sun
  ctx.save();
  ctx.globalAlpha = 0.9;
  ctx.fillStyle = "#ffe27a";
  ctx.beginPath();
  ctx.arc(920, 95, 48, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  // clouds
  function cloud(x, y, s) {
    ctx.save();
    ctx.fillStyle = "rgba(255,255,255,0.9)";
    ctx.beginPath();
    ctx.arc(x, y, 24*s, 0, Math.PI * 2);
    ctx.arc(x+24*s, y-10*s, 28*s, 0, Math.PI * 2);
    ctx.arc(x+54*s, y, 22*s, 0, Math.PI * 2);
    ctx.arc(x+20*s, y+10*s, 26*s, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
  cloud(130, 100, 1.0);
  cloud(390, 82, 0.9);
  cloud(680, 122, 1.1);

  // counter / kitchen line
  ctx.fillStyle = "#e6d4aa";
  ctx.fillRect(0, groundY, W, H - groundY);
  ctx.fillStyle = "#d3bc82";
  ctx.fillRect(0, groundY, W, 12);

  for (let x = 0; x < W; x += 64) {
    ctx.fillStyle = x % 128 === 0 ? "rgba(255,255,255,0.16)" : "rgba(0,0,0,0.04)";
    ctx.fillRect(x, groundY + 24, 36, 130);
  }

  // shelves
  ctx.fillStyle = "#bb8d53";
  ctx.fillRect(40, 210, 210, 14);
  ctx.fillRect(810, 220, 230, 14);

  // clean dishes on shelf
  for (let i = 0; i < 4; i++) {
    ctx.fillStyle = "#fff";
    ctx.beginPath();
    ctx.ellipse(80 + i*38, 204, 16, 6, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = "#c8d7e1";
    ctx.lineWidth = 2;
    ctx.stroke();
  }
}

function drawPlayer() {
  const blink = Math.floor(Date.now() / 250) % 8 === 0;
  const walk = Math.sin(Date.now() / 110) * 4 * Math.min(1, Math.abs(player.vx) / player.speed);
  const px = player.x;
  const py = player.y;

  ctx.save();
  if (player.invuln > 0 && Math.floor(player.invuln / 4) % 2 === 0) ctx.globalAlpha = 0.5;

  // legs
  ctx.strokeStyle = "#28415b";
  ctx.lineWidth = 8;
  ctx.lineCap = "round";
  ctx.beginPath();
  ctx.moveTo(px + 18, py + 78);
  ctx.lineTo(px + 16, py + 102 + walk);
  ctx.moveTo(px + 36, py + 78);
  ctx.lineTo(px + 40, py + 102 - walk);
  ctx.stroke();

  // dress
  ctx.fillStyle = "#ff4f8b";
  ctx.beginPath();
  ctx.moveTo(px + 8, py + 36);
  ctx.lineTo(px + 44, py + 36);
  ctx.lineTo(px + 50, py + 82);
  ctx.lineTo(px + 4, py + 82);
  ctx.closePath();
  ctx.fill();

  // arms
  ctx.strokeStyle = "#f1c39a";
  ctx.lineWidth = 7;
  ctx.beginPath();
  ctx.moveTo(px + 10, py + 45);
  ctx.lineTo(px - 4, py + 58 + walk * 0.5);
  ctx.moveTo(px + 42, py + 45);
  ctx.lineTo(px + 56, py + 58 - walk * 0.5);
  ctx.stroke();

  // head
  ctx.fillStyle = "#f1c39a";
  ctx.beginPath();
  ctx.arc(px + 26, py + 22, 20, 0, Math.PI * 2);
  ctx.fill();

  // hair (brown)
  ctx.fillStyle = "#6a3d20";
  ctx.beginPath();
  ctx.arc(px + 26, py + 17, 23, Math.PI, Math.PI * 2);
  ctx.lineTo(px + 48, py + 32);
  ctx.quadraticCurveTo(px + 44, py + 48, px + 36, py + 44);
  ctx.lineTo(px + 18, py + 44);
  ctx.quadraticCurveTo(px + 6, py + 47, px + 4, py + 30);
  ctx.closePath();
  ctx.fill();

  // eyes + smile
  ctx.strokeStyle = "#1d1d1d";
  ctx.lineWidth = 2;
  if (!blink) {
    ctx.beginPath();
    ctx.moveTo(px + 18, py + 22);
    ctx.lineTo(px + 21, py + 22);
    ctx.moveTo(px + 31, py + 22);
    ctx.lineTo(px + 34, py + 22);
    ctx.stroke();
  }
  ctx.beginPath();
  ctx.arc(px + 26, py + 29, 6, 0.15, Math.PI - 0.15);
  ctx.stroke();

  // soap launcher
  ctx.fillStyle = "#5ed4ff";
  ctx.fillRect(px + (player.dir === 1 ? 45 : -6), py + 50, 16, 10);

  ctx.restore();
}

function drawDog() {
  const x = dog.x;
  const y = dog.y;
  const wag = Math.sin(Date.now() / 90) * 10;
  const barkOpen = dog.attackAnim > 0 ? 6 : 0;

  if (dog.attackAnim > 0) dog.attackAnim--;

  ctx.save();
  // body
  ctx.fillStyle = "#111";
  ctx.fillRect(x + 14, y + 10, 42, 24);
  ctx.beginPath();
  ctx.ellipse(x + 28, y + 20, 28, 16, 0, 0, Math.PI * 2);
  ctx.fill();

  // head
  ctx.beginPath();
  ctx.arc(x + 64, y + 18, 14, 0, Math.PI * 2);
  ctx.fill();

  // ear
  ctx.beginPath();
  ctx.moveTo(x + 57, y + 8);
  ctx.lineTo(x + 62, y - 8);
  ctx.lineTo(x + 69, y + 8);
  ctx.closePath();
  ctx.fill();

  // legs
  ctx.fillRect(x + 18, y + 28, 6, 20);
  ctx.fillRect(x + 30, y + 28, 6, 20);
  ctx.fillRect(x + 44, y + 28, 6, 20);
  ctx.fillRect(x + 54, y + 28, 6, 20);

  // tail
  ctx.strokeStyle = "#111";
  ctx.lineWidth = 6;
  ctx.beginPath();
  ctx.moveTo(x + 10, y + 16);
  ctx.lineTo(x - 6, y + 4 + wag * 0.15);
  ctx.stroke();

  // eye
  ctx.fillStyle = "#fff";
  ctx.beginPath();
  ctx.arc(x + 68, y + 15, 2.3, 0, Math.PI * 2);
  ctx.fill();

  // mouth
  ctx.strokeStyle = "#fff";
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(x + 73, y + 23);
  ctx.lineTo(x + 80 + barkOpen, y + 25);
  ctx.stroke();

  ctx.restore();
}

function drawBubble(b) {
  ctx.save();
  const g = ctx.createRadialGradient(b.x - 4, b.y - 4, 2, b.x, b.y, b.r);
  g.addColorStop(0, "rgba(255,255,255,0.95)");
  g.addColorStop(0.45, "rgba(175,235,255,0.55)");
  g.addColorStop(1, "rgba(100,210,255,0.15)");
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = "rgba(255,255,255,0.85)";
  ctx.lineWidth = 2;
  ctx.stroke();
  ctx.restore();
}

function drawBark(b) {
  ctx.save();
  ctx.globalAlpha = b.life / 18;
  ctx.strokeStyle = "#6fd0ff";
  ctx.lineWidth = 4;
  for (let i = 0; i < 3; i++) {
    ctx.beginPath();
    ctx.arc(b.x + i * 22, b.y + b.h / 2, 20 + i * 10, -0.6, 0.6);
    ctx.stroke();
  }
  ctx.restore();
}

function drawEnemy(e) {
  ctx.save();
  ctx.translate(e.x + e.w/2, e.y + e.h/2 + Math.sin(e.bob) * 3);
  ctx.rotate(e.rot);

  if (e.hitFlash > 0) {
    ctx.shadowBlur = 18;
    ctx.shadowColor = "#9fe9ff";
  }

  if (e.type === "plate") {
    ctx.fillStyle = "#fdfdfd";
    ctx.beginPath();
    ctx.arc(0, 0, 25, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = "#cfd6dc";
    ctx.lineWidth = 5;
    ctx.stroke();
    ctx.fillStyle = "#6f4b2d";
    ctx.beginPath();
    ctx.arc(-5, -3, 5, 0, Math.PI * 2);
    ctx.arc(6, 4, 4, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = "#1d1d1d";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(-8, 6);
    ctx.lineTo(-2, 10);
    ctx.lineTo(10, 5);
    ctx.stroke();
  } else if (e.type === "fork") {
    ctx.fillStyle = "#b7c4ce";
    ctx.fillRect(-4, -30, 8, 55);
    ctx.fillRect(-9, -35, 3, 15);
    ctx.fillRect(-3, -35, 3, 15);
    ctx.fillRect(3, -35, 3, 15);
    ctx.fillRect(9, -35, 3, 15);
    ctx.fillStyle = "#6f4b2d";
    ctx.beginPath();
    ctx.arc(0, 12, 5, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = "#1d1d1d";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(-4, 21);
    ctx.lineTo(4, 21);
    ctx.stroke();
  } else if (e.type === "pan") {
    ctx.fillStyle = "#444";
    ctx.beginPath();
    ctx.ellipse(0, 0, 28, 18, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = "#888";
    ctx.lineWidth = 4;
    ctx.stroke();
    ctx.fillRect(14, -5, 28, 10);
    ctx.fillStyle = "#6f4b2d";
    ctx.beginPath();
    ctx.arc(-4, -1, 7, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = "#1d1d1d";
    ctx.beginPath();
    ctx.moveTo(-10, 9);
    ctx.lineTo(4, 8);
    ctx.stroke();
  }

  ctx.restore();
}

function drawParticles() {
  for (const s of sparkles) {
    ctx.save();
    ctx.globalAlpha = Math.max(0, s.life / 30);
    if (s.type === "soap") {
      ctx.fillStyle = "#8fe3ff";
      ctx.beginPath();
      ctx.arc(s.x, s.y, 3.5, 0, Math.PI * 2);
      ctx.fill();
    } else {
      ctx.fillStyle = "#ffffff";
      ctx.beginPath();
      ctx.arc(s.x, s.y, 2.5, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }

  for (const s of splats) {
    ctx.save();
    ctx.globalAlpha = Math.max(0, s.life / 36);
    ctx.translate(s.x, s.y);
    ctx.rotate(Math.atan2(s.vy, s.vx));
    if (s.kind === "plate") ctx.fillStyle = "#e4eef3";
    else if (s.kind === "fork") ctx.fillStyle = "#b7c4ce";
    else ctx.fillStyle = "#555";
    ctx.fillRect(-4, -2, 8, 4);

    ctx.fillStyle = "#6f4b2d";
    ctx.beginPath();
    ctx.arc(0, 0, 2.2, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  for (const t of floatingTexts) {
    ctx.save();
    ctx.globalAlpha = Math.max(0, t.life / 28);
    ctx.font = "bold 20px Arial";
    ctx.textAlign = "center";
    ctx.fillStyle = t.hurt ? "#d62828" : "#134074";
    ctx.fillText(t.text, t.x, t.y);
    ctx.restore();
  }
}

function drawUI() {
  // title
  ctx.save();
  ctx.font = "bold 34px Arial";
  ctx.fillStyle = "#183153";
  ctx.fillText("Super Agustina", 28, 44);

  ctx.font = "bold 18px Arial";
  ctx.fillStyle = "#355070";
  ctx.fillText("¡Limpia la cocina eliminando los platos sucios!", 30, 70);

  // hp bar
  ctx.fillStyle = "rgba(255,255,255,0.75)";
  ctx.fillRect(28, 88, 220, 26);
  ctx.fillStyle = "#ef476f";
  ctx.fillRect(32, 92, (player.hp / player.maxHp) * 212, 18);
  ctx.strokeStyle = "#355070";
  ctx.lineWidth = 2;
  ctx.strokeRect(32, 92, 212, 18);
  ctx.fillStyle = "#183153";
  ctx.font = "bold 15px Arial";
  ctx.fillText("energía", 36, 108);

  // bark cooldown
  ctx.fillStyle = "rgba(255,255,255,0.75)";
  ctx.fillRect(28, 124, 220, 18);
  ctx.fillStyle = "#6fd0ff";
  const barkReady = 1 - (player.barkCd / 70);
  ctx.fillRect(32, 128, clamp(barkReady, 0, 1) * 212, 10);
  ctx.strokeStyle = "#355070";
  ctx.strokeRect(32, 128, 212, 10);
  ctx.fillStyle = "#183153";
  ctx.font = "bold 13px Arial";
  ctx.fillText("Dog Bark", 255, 139);

  ctx.textAlign = "right";
  ctx.font = "bold 26px Arial";
  ctx.fillStyle = "#183153";
  ctx.fillText("Score: " + score, W - 28, 44);
  ctx.fillText("Wave: " + wave, W - 28, 76);

  ctx.font = "bold 16px Arial";
  ctx.fillStyle = "#355070";
  ctx.fillText("Goal: " + winScore, W - 28, 102);

  ctx.restore();
}

function drawTitle() {
  ctx.save();
  ctx.fillStyle = "rgba(255,255,255,0.72)";
  ctx.fillRect(120, 120, 860, 360);

  ctx.textAlign = "center";
  ctx.fillStyle = "#183153";
  ctx.font = "bold 62px Arial";
  ctx.fillText("SUPER AGUSTINA", W/2, 205);

  ctx.font = "bold 26px Arial";
  ctx.fillStyle = "#355070";
  ctx.fillText("¡Una valiente niña de cabello castaño y su gran perro negro", W/2, 255);
  ctx.fillText("deben derrotar a un ejército de platos sucios!", W/2, 292);

  ctx.font = "22px Arial";
  ctx.fillStyle = "#1d3557";
  ctx.fillText("pompa de jabón: J or F", W/2, 350);
  ctx.fillText("explosión de ladrido de perro: K or G", W/2, 384);
  ctx.fillText("Presione Enter o la barra espaciadora para comenzar.", W/2, 436);

  ctx.restore();
}

function drawGameOver() {
  ctx.save();
  ctx.fillStyle = "rgba(10, 20, 30, 0.48)";
  ctx.fillRect(0, 0, W, H);

  ctx.fillStyle = "rgba(255,255,255,0.92)";
  ctx.fillRect(220, 150, 660, 260);

  ctx.textAlign = "center";
  ctx.fillStyle = "#183153";
  ctx.font = "bold 52px Arial";
  const won = score >= winScore && player.hp > 0;
  ctx.fillText(won ? "Kitchen Saved!" : "Dirty Dishes Win!", W/2, 232);

  ctx.font = "bold 26px Arial";
  ctx.fillStyle = "#355070";
  ctx.fillText("Final Score: " + score, W/2, 285);
  ctx.fillText(won ? "¡Agustina y su perro lo limpiaron todo!" : "¡Inténtalo de nuevo y frota con más fuerza!", W/2, 328);

  ctx.font = "22px Arial";
  ctx.fillText("Press R to return to the title screen", W/2, 376);
  ctx.restore();
}

function render() {
  ctx.clearRect(0, 0, W, H);

  const shakeX = cameraShake > 0 ? rand(-cameraShake, cameraShake) : 0;
  const shakeY = cameraShake > 0 ? rand(-cameraShake, cameraShake) : 0;

  ctx.save();
  ctx.translate(shakeX, shakeY);

  drawBackground();

  for (const b of barks) drawBark(b);
  for (const b of bubbles) drawBubble(b);
  drawDog();
  drawPlayer();
  for (const e of enemies) drawEnemy(e);
  drawParticles();
  drawUI();

  if (state === "title") drawTitle();
  if (state === "gameover") drawGameOver();

  ctx.restore();
}

function loop() {
  update();
  render();
  requestAnimationFrame(loop);
}

resetGame();
loop();
</script>
</body>
</html>
